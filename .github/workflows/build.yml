name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake qt6-base-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/linux --parallel 2
      - name: Stage Linux artifact
        run: |
          mkdir -p dist/linux
          cp build/linux/pkg_extractor readme_linux.txt dist/linux/
      - uses: actions/upload-artifact@v6
        with:
          name: pkg-extractor-linux
          path: dist/linux/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: brew install qt zlib
      - name: Configure
        run: cmake -S . -B build/macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix zlib)" -DZLIB_USE_STATIC_LIBS=ON
      - name: Build
        run: cmake --build build/macos --parallel 2
      - name: Bundle Qt frameworks
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" "$GITHUB_WORKSPACE/build/macos/pkg_extractor.app" -verbose=3
      - uses: actions/upload-artifact@v6
        with:
          name: pkg-extractor-macos
          path: build/macos/**/pkg_extractor.app/**

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-ntldd
      - name: Configure
        run: cmake -S . -B build/windows -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/ucrt64
      - name: Build
        run: cmake --build build/windows --parallel 2
      - name: Bundle Windows executable
        run: |
          mkdir -p dist/pkg-extractor-windows
          if command -v windeployqt6 >/dev/null 2>&1; then
            windeployqt6 --release --compiler-runtime --no-translations --dir dist/pkg-extractor-windows build/windows/pkg_extractor.exe
          else
            windeployqt --release --compiler-runtime --no-translations --dir dist/pkg-extractor-windows build/windows/pkg_extractor.exe
          fi
          cp build/windows/pkg_extractor.exe dist/pkg-extractor-windows/
          mapfile -d '' deployed_dlls < <(find dist/pkg-extractor-windows -type f -iname '*.dll' -print0)
          dependencies=$(ntldd -R build/windows/pkg_extractor.exe "${deployed_dlls[@]}")
          direct_dependencies=$(ntldd build/windows/pkg_extractor.exe "${deployed_dlls[@]}")
          unresolved=$(printf '%s\n' "$direct_dependencies" \
            | sed -nE '/=> not found$/p' \
            | grep -viE '^[[:space:]]*(api-ms-win-|ext-ms-win-)' || true)
          if [ -n "$unresolved" ]; then
            printf '%s\n' "$unresolved" >&2
            echo "Unresolved Windows DLL dependencies found." >&2
            exit 1
          fi
          while IFS= read -r dependency; do
            dependency_path=$(cygpath -u "$dependency")
            case "$dependency_path" in
              */ucrt64/bin/*) cp "$dependency_path" dist/pkg-extractor-windows/ ;;
            esac
          done < <(printf '%s\n' "$dependencies" | sed -nE 's/^.* => (.*) \(0x[[:xdigit:]]+\)$/\1/p' | sort -u)
          cp install_pkg.bat batch_install.bat readme_windows.txt dist/pkg-extractor-windows/
          printf '%s\r\n' \
            '@echo off' \
            'start "" /D "%~dp0pkg-extractor-windows" "%~dp0pkg-extractor-windows\pkg_extractor.exe" %*' \
            > "dist/Start Pkg Extractor.bat"
      - uses: actions/upload-artifact@v6
        with:
          name: pkg-extractor-windows
          path: dist/
