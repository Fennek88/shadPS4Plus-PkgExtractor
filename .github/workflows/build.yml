name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake qt6-base-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/linux --parallel 2
      - uses: actions/upload-artifact@v6
        with:
          name: pkg-extractor-linux
          path: |
            build/linux/pkg_extractor
            readme_linux.txt

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: brew install qt zlib
      - name: Configure
        run: cmake -S . -B build/macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix zlib)" -DZLIB_USE_STATIC_LIBS=ON
      - name: Build
        run: cmake --build build/macos --parallel 2
      - name: Bundle Qt frameworks
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" "$GITHUB_WORKSPACE/build/macos/pkg_extractor.app" -verbose=3
          ditto -c -k --sequesterRsrc --keepParent "$GITHUB_WORKSPACE/build/macos/pkg_extractor.app" pkg-extractor-macos.zip
      - uses: actions/upload-artifact@v6
        with:
          name: pkg-extractor-macos
          path: pkg-extractor-macos.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-zlib
      - name: Configure
        run: cmake -S . -B build/windows -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/ucrt64
      - name: Build
        run: cmake --build build/windows --parallel 2
      - name: Bundle Windows executable
        run: |
          mkdir -p dist/windows
          if command -v windeployqt6 >/dev/null 2>&1; then
            windeployqt6 --release --compiler-runtime --no-translations --dir dist/windows build/windows/pkg_extractor.exe
          else
            windeployqt --release --compiler-runtime --no-translations --dir dist/windows build/windows/pkg_extractor.exe
          fi
          cp build/windows/pkg_extractor.exe dist/windows/
          cp /ucrt64/bin/zlib1.dll dist/windows/
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/windows/
          cp /ucrt64/bin/libstdc++-6.dll dist/windows/
          cp /ucrt64/bin/libwinpthread-1.dll dist/windows/
          for f in /ucrt64/bin/libb2*.dll /ucrt64/bin/libdouble-conversion*.dll /ucrt64/bin/libicu*.dll; do
            if [ -f "$f" ]; then cp "$f" dist/windows/; fi
          done
          cp install_pkg.bat batch_install.bat readme_windows.txt dist/windows/
      - uses: actions/upload-artifact@v6
        with:
          name: pkg-extractor-windows
          path: dist/windows/
